# claw — example config
#
# Copy this file outside the repo (somewhere private to the host that runs
# claw) and fill in real values. Access tokens and bot passwords are NEVER
# inlined here — they live in separate one-line files referenced by
# *_file: paths, mode 0600.

verbose: false

ollama:
  base_url: http://127.0.0.1:11434
  default_compaction_model: qwen3.6:35b-a3b
  # Cap on tool round-trips per inbound message before claw forces a stub
  # final reply. Cron-driven research tasks can legitimately need 15-25.
  max_tool_turns: 30
  # Per-/api/chat-call generation cap (Ollama options.num_predict). When
  # the model hits this, claw inspects the partial: an unclosed Markdown
  # code fence triggers an immediate fail-loud return; otherwise claw
  # injects the partial back as an assistant turn plus a recovery system
  # note and re-calls /api/chat once so the model can wrap up, restart
  # tighter, or bail. null or -1 disables (unbounded — runaway reasoning
  # traces can hang the call until request_timeout_s fires).
  num_predict: 8192
  # httpx read timeout per /api/chat call. Should comfortably exceed the
  # worst-case wall time for one num_predict-bounded generation on the
  # slowest agent's model.
  request_timeout_s: 1800

memory_retrieval:
  top_n: 5         # max chunks injected into the per-turn prompt
  compact: true    # collapse retrieval block to a single header + bullets

searxng:
  base_url: http://127.0.0.1:8080

cron:
  enabled: true
  jobs_file: /path/to/cron/jobs.json
  max_instances_per_job: 1
  # Agent ids that get cron_add / cron_list / cron_remove. Empty disables
  # agent-driven scheduling entirely (jobs in jobs.json still fire).
  exposed_to: []
  # Fallback delivery target when cron_add is called without an explicit
  # deliver_to. Omit (or null) to require deliver_to per call.
  # default_deliver_to: "@user-1:example.com"
  misfire_grace_time: 3600              # grace (s) for one-shot `at` jobs missed
                                        # while down: <= this fires late on next
                                        # boot; more is surfaced to the owning
                                        # agent as a deliver-or-discard review.
                                        # `at` jobs only; cron keeps the default.

subagents:
  max_concurrent: 8
  max_children_per_agent: 5
  default_model: qwen3.6:35b-a3b
  # Each persona declares its own max_spawn_depth (default 0 = leaf) and an
  # optional can_spawn allowlist (default None = no restriction beyond
  # max_spawn_depth). When a parent forks a persona, the child's effective
  # budget is min(parent_remaining - 1, persona.max_spawn_depth) AND the
  # spawn must be in the parent's can_spawn list (if any). Top-level
  # agents set their own ceiling + allowlist under `agents:` below.
  # Per-persona num_predict and max_tool_turns override ollama.* globals
  # (null inherits). Tune by role: researchers benefit from headroom for
  # deep reasoning AND a higher tool-turn ceiling for iterative web_search +
  # file inspection; grunts should stay tight on both; coders sit in
  # between.
  personas:                              # case-insensitive lookup
    persona-1: { model: qwen3.5:122b,        role: researcher,  max_spawn_depth: 1, can_spawn: [persona-3], num_predict: 16384, max_tool_turns: 60 }
    persona-2: { model: qwen3-coder-next,    role: coder,       max_spawn_depth: 1, can_spawn: [persona-3], num_predict: 8192,  max_tool_turns: 40 }
    persona-3: { model: qwen3.6:35b-a3b,     role: grunt,                                                   num_predict: 4096,  max_tool_turns: 20 }

compaction:
  idle_recap_seconds: 3600
  # Tuned for a 192K Ollama context. mid_session_token_threshold fires
  # compaction at ~50% of context; reserve_tokens is the newest-tokens
  # budget preserved verbatim (older portion summarized to one recap row).
  # Scale these together to your context window: trigger ≈ 2× reserve.
  mid_session_token_threshold: 96000
  reserve_tokens: 48000

memory_flush:
  enabled: true
  periodic_growth_threshold: 4000       # periodic flush via maintenance loop
                                        # (paired with reindex). Fires when a
                                        # session has grown by this many tokens
                                        # since its last flush. The other flush
                                        # path is "pre-compact" — fired in the
                                        # bg task that runs flush then mid-
                                        # session compaction when tokens cross
                                        # compaction.mid_session_token_threshold.
  turn_timeout_s: 300.0                 # per-flush deadline. On timeout the
                                        # flush is dropped and compaction
                                        # proceeds anyway.

memory_curation:                        # nightly "forgetory" curator — a
                                        # heavier pass than the collector above.
                                        # Coupled to memory_flush: only runs
                                        # when it's enabled.
  enabled: true
  hour: 4                               # local-tz hour (quiet: off the reply
                                        # path; curator skips today's note).
  recent_window_days: 14                # re-scan this many days of recent notes
                                        # for now-lapsed ephemera (time-, not
                                        # change-, triggered).
  model: qwen3.5:122b                   # bigger model: supersession/dedup is
                                        # relational judgment worth the cost.
  near_neighbor_k: 8                    # near-neighbours per changed memory,
                                        # for dedup/supersession judgment.
  max_files_per_run: 0                  # ONE file per curator turn; cap files
                                        # per invocation (0 = unlimited) to
                                        # chunk a large first bootstrap.
  max_tool_turns: 80                    # investigative latitude (reads + edits).
  num_predict: 16384                    # 2x the global default — a whole-note
                                        # rewrite in one write_file is large;
                                        # truncation would corrupt memory.
  turn_timeout_s: 1800.0                # per-curation deadline; retried nightly.
  superseded_archive_days: 30           # a whole-corpus review turn (every pass,
                                        # window-independent) is handed the full
                                        # superseded list with ages and archives
                                        # ones superseded ~this many+ days ago,
                                        # case-by-case. Age = the superseding
                                        # memory's ts.

# IANA timezone name. Used for every operator-facing timestamp claw renders:
# the inbound-message envelope (so the model sees today's date + day-of-week
# on every turn), the daily-note filename `memory/YYYY-MM-DD.md`, and the
# daily-session-rotate hour. Omit (or null) for UTC. Internal/persisted
# timestamps (transcripts, memory sync state) stay UTC regardless.
# tz: America/New_York

# Language every agent replies in, as a human-readable id with locale (e.g.
# "English (en_US)"). Injected into every system prompt so a bilingual model
# doesn't code-switch — chiefly to keep the voice TTS from being handed
# unreadable non-Latin output. Omit (or null) for no steering.
# language: "English (en_US)"

lifecycle:
  # Hour (0-23, in `tz` above) at which to rotate every agent's active
  # sessions: run one final memory_flush per session, archive the JSONL with
  # a `.reset-<ts>` suffix, and clear per-session in-memory caches. The next
  # inbound message starts a fresh session with no prior turns. Memory files
  # under <workspace>/memory/ are NOT touched, so durable knowledge persists
  # across the rotate. Comment out (or leave unset) to disable.
  # daily_session_rotate_hour: 4

# In-band admin commands. When enabled, a Matrix message whose body starts
# with `prefix` is intercepted as control plane: it never reaches the LLM and
# is never written to the transcript. A message is only treated as a command
# when ALL hold — `enabled: true`, the message came over matrix (not a
# synthetic cron/subagent/initial_prompt channel), the sender's MXID is in
# `allow`, and the body parses. Otherwise it flows through as ordinary text
# with no reply and no indication the sigil meant anything (an unauthorized
# sender sees identical behavior to commands being disabled).
#
# Commands: %compact (flush, then force a context compaction now), %clear
# (final memory-flush then wipe this session), %context (report token/row
# usage), %stop [<task_id>] [--soft] (cancel the in-flight turn + its
# whole subagent cascade and SIGKILL their bash trees; <task_id> instead
# cancels just that subagent subtree; --soft skips the bash kill so an
# in-flight non-idempotent command can finish), %subagents (list this
# conversation's running subagents), %verbose <on|off> (toggle DEBUG
# logging process-wide).
#
# In a group room with matrix.allow_bots: mentions, the command body must
# @-mention the bot or the event never reaches the gateway at all.
commands:
  # Defaults true; `allow` is the real gate (empty = nobody, fail closed),
  # so this is effectively off until you list operator MXIDs below.
  enabled: true
  # "%" is safe — Matrix clients don't intercept it (unlike "/"), it isn't
  # Markdown, and it's improbable as a natural first character.
  prefix: "%"
  # MXIDs allowed to run commands. Empty = nobody (fail closed). Kept separate
  # from per-agent matrix.allow_from so DM access doesn't grant control plane.
  allow:
    - "@user-1:matrix.example.com"

# Voice pipeline — global service config. One WebSocket server fronts every
# device on the gateway. Session-level tunings live here (they're global, not
# per-device); the only per-agent voice setting is `piper_voice` (below).
# Physical devices and their agent binding live in the `devices:` block.
# Omit this whole block to disable voice gateway-wide.
# voice:
#   # WebSocket server bind address. 0.0.0.0 = listen on all interfaces.
#   # Restrict to a Tailscale interface IP for tighter scoping.
#   bind_host: 0.0.0.0
#   bind_port: 11500
#   # Shared token the firmware presents on connect. One line, mode 0600.
#   # Omit to disable auth — only safe on a fully closed network.
#   auth_token_file: /path/to/credentials/voice.token
#   # Wyoming endpoints for STT / TTS / wake. Defaults assume local services
#   # on the conventional Wyoming ports. The wake server loads its own *.onnx
#   # models (its model dir IS the wake-word set); the gateway evaluates all
#   # of them and any detection wakes the device's bound agent.
#   piper_uri: tcp://127.0.0.1:10200
#   whisper_uri: tcp://127.0.0.1:10300
#   openwakeword_uri: tcp://127.0.0.1:10400
#   # Session-level pipeline tunings (global):
#   multi_turn_window_s: 7.0      # keep mic hot N s after a reply (0 = re-wake)
#   preroll_seconds: 15.0         # prepend N s of pre-wake ambient to STT
#   endpoint_silence_ms: 1000     # end-of-speech threshold pushed in HelloAck
#   # Resample TTS to this rate before sending (Hz). Set it for devices whose
#   # playback clock is fixed — e.g. the ESP32-S3-BOX-3, whose shared-clock I2S
#   # locks the speaker to the 16 kHz the mic runs at. Default 16000. Use `null`
#   # to send Piper's native rate untouched (hardware with an independent,
#   # higher-rate playback clock).
#   tts_sample_rate: 16000

# Physical devices. Each device's Hello.device_id resolves here → the bound
# `agent` answers, and the matching endpoint supplies identity (sender_id =
# device_id/endpoint_id, sender_name = endpoint name). A device has one voice
# endpoint plus, later, sensor endpoints (event/state). Omit if no devices.
# devices:
#   - device_id: box3            # what the firmware sends in Hello
#     name: Box3                 # device-level label (logs/fallback)
#     agent: example             # which agent this device talks to
#     endpoints:
#       - { id: voice, type: voice, name: "Box3" }

agents:
  - id: example
    workspace: /path/to/workspace
    primary_model: qwen3.6:27b
    compaction_model: qwen3.6:35b-a3b
    # How deep a chain rooted at me can extend. 0 = no spawning. Default 1.
    # Child fork's effective budget is min(this - 1, persona.max_spawn_depth).
    max_spawn_depth: 1
    # Optional persona allowlist. Omit (or null) to allow any persona.
    # Example: can_spawn: [persona-1, persona-2, persona-3]
    # Optional per-agent override of ollama.num_predict. null inherits global.
    # num_predict: 12288
    # Optional per-agent override of ollama.max_tool_turns. null inherits global.
    # max_tool_turns: 40
    # Files injected verbatim into the system prompt every turn. Keep this
    # list to small, stable identity/role/operating-instructions content.
    # Anything large or growing belongs in indexed retrieval (MEMORY.md +
    # memory/YYYY-MM-DD.md) — keep the two lists disjoint so retrieval slots
    # aren't wasted on content the model already sees verbatim.
    extra_paths:
      - IDENTITY.md
      - USER.md
      - SOUL.md
      - AGENTS.md
      - TOOLS.md
    matrix:
      user_id: "@example:matrix.example.com"
      homeserver: http://127.0.0.1:6167
      access_token_file: /path/to/credentials/example.matrix.token
      # Bot account login password — needed only for the one-time cross-signing
      # bootstrap (UIA challenge on /keys/device_signing/upload). If omitted,
      # the bot still works but shows as "user verification unavailable" in
      # Element. Mode 0600.
      password_file: /path/to/credentials/example.matrix.password
      device_id: CLAW_EXAMPLE
      device_name: Claw Example
      store_path: /path/to/workspace/.matrix-store
      encryption: true
      auto_join: always
      allow_bots: mentions
      allow_from:
        - "@user-1:matrix.example.com"
    # Optional voice block: enables this agent for spoken replies. Requires
    # the top-level `voice:` service block, and a device in `devices:` that
    # binds to this agent. Omit to leave this agent matrix-only. The only
    # per-agent voice setting is the TTS voice — wake words belong to the wake
    # server, and session tunings are global (top-level `voice:`).
    # voice:
    #   # Piper voice for this agent's spoken replies. See
    #   # https://github.com/rhasspy/piper/blob/master/VOICES.md for the
    #   # current voice catalog. Each agent may use a distinct voice.
    #   piper_voice: en_US-libritts-high
