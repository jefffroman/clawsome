[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clawsome"
dynamic = ["version"]
description = "A lean Python harness for running persistent AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Jeff Froman", email = "79345648+jefffroman@users.noreply.github.com"},
]
keywords = [
    "ai", "agents", "claw", "matrix", "local-inference",
    "persistent-agents", "gateway", "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "matrix-nio[e2e]>=0.25,<0.27",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "apscheduler>=3.10",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/jefffroman/clawsome"
Repository = "https://github.com/jefffroman/clawsome"
Issues = "https://github.com/jefffroman/clawsome/issues"
Changelog = "https://github.com/jefffroman/clawsome/releases"
Documentation = "https://github.com/jefffroman/clawsome/blob/main/README.md"

[project.scripts]
claw = "claw.main:cli"

[tool.setuptools.packages.find]
include = ["claw*"]

[tool.setuptools.dynamic]
version = {attr = "claw.__version__"}
