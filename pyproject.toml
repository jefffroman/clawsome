[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claw"
version = "0.0.0"
description = "Minimalist Python gateway for a local AI estate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matrix-nio[e2e]>=0.25,<0.27",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "apscheduler>=3.10",
  "chromadb>=0.5",
  "rank-bm25>=0.2.2",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.scripts]
claw = "claw.main:cli"

[tool.setuptools.packages.find]
include = ["claw*"]
