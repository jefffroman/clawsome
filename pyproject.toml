[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clawsome"
dynamic = ["version"]
description = "A lean Python harness for running persistent AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Jeff Froman", email = "79345648+jefffroman@users.noreply.github.com"},
]
keywords = [
    "ai", "agents", "claw", "matrix", "local-inference",
    "persistent-agents", "gateway", "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # The `[e2e]` extra is NOT optional: `nio/crypto/__init__.py` gates every
    # crypto export on the backend package being importable, so a bare
    # `matrix-nio` install leaves ENCRYPTION_ENABLED = False and drops
    # `nio.crypto.Sas` — encryption silently turns OFF rather than failing
    # loudly, and `channel/matrix.py` fails to import.
    #
    # Floor is >=0.26: that release swapped the E2E backend from libolm to
    # vodozemac, which ships a native cp314 macOS arm64 wheel and so retires
    # the patched python-olm sdist build the claw role used to run. Verified
    # on 2026-08-07 before moving: an existing `.matrix-store/` loads natively
    # under vodozemac with no re-bootstrap (identical device fingerprint, all
    # Olm and inbound-group sessions intact), and 0.26 still exposes no
    # cross-signing surface, so `channel/matrix_crosssigning.py` stays.
    "matrix-nio[e2e]>=0.26,<0.27",
    # Ed25519 for cross-signing (claw/channel/pksigning.py). vodozemac has no
    # seed-driven signing primitive, so this replaces the `olm.PkSigning` that
    # matrix-nio used to pull in transitively.
    "cryptography>=42",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "apscheduler>=3.10",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "networkx>=3.2",
    "markdown-it-py>=3",
    "linkify-it-py>=2",
    # HTTP server for claw's turn endpoint (claw.voice_http): a voice-gateway
    # or a smart APK POSTs transcripts and gets the agent's reply back. Core
    # because the endpoint is general (any text-bringing client), not voice-
    # gateway-specific — enable it via the `http_api:` config block.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# NOTE: there is no `voice` extra. The audio pipeline (box WebSocket, wake,
# STT, TTS, resampling) is NOT part of clawsome — it lives in the separate
# `voice-gateway` sibling, which is only usable by our custom edge firmware and
# carries its own deps (wyoming, websockets, numpy, scipy, openwakeword,
# onnxruntime). clawsome ships only the *claw-side* of voice: the HTTP turn
# endpoint (aiohttp, core above) + the modality hint config. The in-house ONNX
# wake *server* is likewise a standalone `wake-server` component with its own
# deps; it imports nothing from clawsome.

[project.urls]
Homepage = "https://github.com/jefffroman/clawsome"
Repository = "https://github.com/jefffroman/clawsome"
Issues = "https://github.com/jefffroman/clawsome/issues"
Changelog = "https://github.com/jefffroman/clawsome/releases"
Documentation = "https://github.com/jefffroman/clawsome/blob/main/README.md"

[project.scripts]
claw = "claw.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Third-party import churn (chromadb / matrix-nio / apscheduler) emits
    # deprecation noise we don't control — keep non-fatal so their upgrades
    # don't break our suite.
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.setuptools.packages.find]
include = ["claw*"]

[tool.setuptools.dynamic]
version = {attr = "claw.__version__"}
